name: chatme
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  # Cap below versions that require Dart >=3.12 (this SDK is 3.11.0)
  flutter_riverpod: ">=3.3.2 <3.4.0"
  font_awesome_flutter: 11.0.0
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  uuid: ^4.6.0
  image_picker: ^1.2.3
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  circle_nav_bar: ^2.2.0
  file_picker: ^12.3.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.2
  open_file: ^4.0.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  skeletonizer: 2.1.1
  image: ^4.10.1
  crop_your_image: ^2.0.1
  google_sign_in: 7.1.0
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  flutter_local_notifications: ^22.0.1
  local_auth: ^3.0.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/images/applogo.png"
  image_path_ios: "assets/images/applogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/applogo.png"
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: "assets/images/applogo.png"

  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

  android_12_dark:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
